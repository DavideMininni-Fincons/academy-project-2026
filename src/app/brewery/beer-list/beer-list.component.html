<div class="title-bar">
  <h2>Beer List</h2>
  <button (click)="goToNewBeer()">+ Add New</button>
</div>
<div class="card-container">
  @for (beer of beers$ | async; track beer.beerId) {
    <app-beer-card
      [id]="beer.beerId"
      [name]="beer.beerName"
      [style]="beer.beerStyle"
      [lastModifiedDate]="beer.lastModifiedDate"
      [upc]="beer.upc"
      [price]="beer.price"
      (deleteClick)="deleteBeer($event)"
    />
  }
</div>
