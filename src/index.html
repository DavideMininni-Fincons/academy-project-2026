<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Basics</title>
  <link rel="icon" type="image/x-icon" href="../public/favicon.ico">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
<div class="planner-container">
  <div class="control-panel">
    <h2>Task Engine Controls</h2>
    <div class="controls-wrapper">
      <div class="btn-group">
        <button id="add-preset-btn" class="btn btn-add">Add Preset Task ⚡</button>
        <button id="sort-btn" class="btn btn-sort">Sort by Duration ⏳</button>
        <button id="boost-btn" class="btn btn-boost">Boost Priorities 🚀</button>
        <button id="lower-btn" class="btn btn-lower">Lower Priorities 🧘🏻‍♂️</button>
      </div>

      <label class="filter-container">
        <input type="checkbox" id="filter-high-priority" class="custom-checkbox">
        <span class="checkbox-box"></span>
        Show High Priority Only ⚠️
      </label>
    </div>
  </div>

  <div id="status-panel" class="status-panel"></div>

  <div class="table-card">
    <table>
      <thead>
      <tr>
        <th>Task Description</th>
        <th>Duration</th>
        <th>Priority</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody id="todo-tbody"></tbody>
    </table>

    <div class="table-footer">
      <span>Total Time: <strong id="total-time">0h (0 min)</strong></span>
    </div>
  </div>
</div>
</body>
</html>
