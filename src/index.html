<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Basics</title>
  <link rel="icon" type="image/x-icon" href="../public/favicon.ico">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
<div class="app-container">
  <div class="card form-card">
    <h2>Create New Hero</h2>
    <form id="hero-form">
      <div class="form-group">
        <label for="hero-name">Hero Name:</label>
        <input type="text" id="hero-name" placeholder="e.g. Arthas" required>
      </div>

      <div class="form-group">
        <label for="hero-role">Class</label>
        <select id="hero-role" required>
          <option value="" disabled selected>Select a class...</option>
          <option value="Warrior">Warrior 🛡️</option>
          <option value="Mage">Mage 🔮</option>
          <option value="Rogue">Rogue 🗡️</option>
          <option value="Cleric">Cleric 💖</option>
        </select>
      </div>

      <div class="form-group">
        <label for="hero-hp">Maximum HP:</label>
        <input type="number" id="hero-hp" min="10" max="500" placeholder="e.g. 100" required>
      </div>

      <button type="submit" id="save-btn">Save Hero 💾</button>
    </form>
  </div>

  <div class="card table-card">
    <h2>Heroes</h2>
    <div class="table-wrapper">
      <table>
        <thead>
        <tr>
          <th>Name</th>
          <th>Class</th>
          <th>HP Status</th>
          <th>EXP</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody id="heroes-tbody">
        <tr>
          <td colspan="5">No heroes</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
