<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Basics</title>
  <link rel="icon" type="image/x-icon" href="../public/favicon.ico">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
<h2>Course Checkout</h2>

<form id="checkout-form">
  <div class="form-group">
    <label for="course-price">Price (€):</label>
    <input type="text" id="course-price" placeholder="e.g., 40" required>
  </div>

  <div class="form-group">
    <label for="coupon-code">Coupon Code:</label>
    <input type="text" id="coupon-code" placeholder="e.g., SUMMER20">
  </div>

  <div class="form-group checkbox-group">
    <input type="checkbox" id="vip-member">
    <label for="vip-member">I am a VIP Member</label>
  </div>

  <button type="submit">Calculate Total</button>
</form>

<p id="result"></p>
</body>
</html>
